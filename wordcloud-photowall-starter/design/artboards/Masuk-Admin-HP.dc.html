<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Masuk admin sesi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: {{c.bg}}; color: {{c.fg}}; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column">
<header style="display: flex; align-items: center; justify-content: flex-end; box-sizing: border-box; padding: 14px 18px">
<button type="button" onClick="{{toggleMode}}" aria-label="Ganti ke mode {{modeNext}}" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 999px; border: 1px solid {{c.line}}; background: {{c.surface}}; color: {{c.fg}}; cursor: pointer">
<sc-if value="{{isDark}}" hint-placeholder-val="{{true}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
</sc-if>
<sc-if value="{{isLight}}" hint-placeholder-val="{{false}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>
</sc-if>
</button>
</header>
<main style="flex-grow: 1; box-sizing: border-box; padding: 28px 22px 28px; display: flex; flex-direction: column; gap: 24px">
<a href="Landing.dc.html" style="align-self: flex-start; display: flex; align-items: center; gap: 6px; color: {{c.muted}}; font-size: 14px; font-weight: 600; text-decoration: none">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
Kembali
</a>
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em">Masuk admin sesi</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: {{c.muted}}">Cukup ketik kode sesi dan PIN 6 digit. Tidak perlu kamera.</p>
</div>
<form style="display: flex; flex-direction: column; gap: 16px; margin: 0">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="kode-admin" style="font-size: 14px; font-weight: 700">Kode sesi</label>
<input id="kode-admin" type="text" value="RGW4TK" readonly="readonly" style="box-sizing: border-box; height: 60px; padding: 0 16px; border-radius: 14px; border: 1px solid {{c.line}}; background: {{c.field}}; color: {{c.fg}}; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 24px; letter-spacing: 0.2em">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="pin-admin" style="font-size: 14px; font-weight: 700">PIN admin</label>
<input id="pin-admin" type="password" value="482913" readonly="readonly" inputmode="numeric" aria-describedby="pin-bantu" style="box-sizing: border-box; height: 60px; padding: 0 16px; border-radius: 14px; border: 2px solid {{c.ring}}; background: {{c.field}}; color: {{c.fg}}; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 24px; letter-spacing: 0.3em">
<span id="pin-bantu" style="font-size: 13px; color: {{c.muted}}">Maksimal 10 percobaan per menit. Sesi admin aktif 24 jam.</span>
</div>
<a href="Admin-Sesi-HP.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 60px; margin-top: 4px; border-radius: 16px; background: {{c.primary}}; color: {{c.onPrimary}}; font-size: 17px; font-weight: 800; text-decoration: none">Masuk</a>
</form>
<div style="display: flex; align-items: center; gap: 12px; font-size: 13px; color: {{c.muted}}">
<span style="flex-grow: 1; height: 1px; background: {{c.line}}"></span>
atau
<span style="flex-grow: 1; height: 1px; background: {{c.line}}"></span>
</div>
<button type="button" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 54px; border-radius: 16px; border: 1px solid {{c.line}}; background: transparent; color: {{c.fg}}; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"></path></svg>
Scan QR admin
</button>
<a href="Admin-Global-Login.dc.html" style="margin-top: auto; align-self: center; color: {{c.fg}}; font-size: 14px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px">Masuk sebagai admin global</a>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  pal(mode) {
    if (mode === 'light') return { bg: '#F4F3EE', surface: '#FFFFFF', surface2: '#EFEEE8', line: '#DCDAD1', fg: '#141416', muted: '#55555D', primary: '#141416', onPrimary: '#FFFFFF', markBg: '#141416', field: '#FFFFFF', ring: '#141416' };
    return { bg: '#0D0D0F', surface: '#16161A', surface2: '#1F1F25', line: '#2C2C34', fg: '#F4F3EF', muted: '#A3A3AD', primary: '#FFE14D', onPrimary: '#111111', markBg: '#1F1F25', field: '#0F0F12', ring: '#FFE14D' };
  }
  renderVals() {
    var self = this;
    var mode = (this.state && this.state.mode) || this.props.mode || 'dark';
    return {
      c: this.pal(mode),
      isDark: mode === 'dark',
      isLight: mode === 'light',
      modeNext: mode === 'dark' ? 'terang' : 'gelap',
      toggleMode: function () { self.setState({ mode: mode === 'dark' ? 'light' : 'dark' }); }
    };
  }
}
</script>
</body>
</html>
