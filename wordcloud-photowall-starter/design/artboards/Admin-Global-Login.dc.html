<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Login admin global</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; background: {{c.bg}}; color: {{c.fg}}; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column">
<header style="display: flex; align-items: center; justify-content: flex-end; box-sizing: border-box; padding: 16px 32px">
<button type="button" onClick="{{toggleMode}}" aria-label="Ganti ke mode {{modeNext}}" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid {{c.line}}; background: {{c.surface}}; color: {{c.fg}}; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">
<sc-if value="{{isDark}}" hint-placeholder-val="{{true}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
</sc-if>
<sc-if value="{{isLight}}" hint-placeholder-val="{{false}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>
</sc-if>
Mode {{modeNext}}
</button>
</header>
<main style="flex-grow: 1; display: flex; align-items: center; justify-content: center; box-sizing: border-box; padding: 24px 20px 64px">
<form style="width: 100%; max-width: 420px; box-sizing: border-box; padding: 32px; border-radius: 22px; border: 1px solid {{c.line}}; background: {{c.surface}}; display: flex; flex-direction: column; gap: 20px; margin: 0">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="align-self: flex-start; display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; background: {{c.surface2}}; font-size: 12px; font-weight: 800; letter-spacing: 0.06em">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6l8-3z"></path></svg>
ADMIN GLOBAL
</span>
<h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em">Masuk</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: {{c.muted}}">Kelola semua sesi, blocklist, default tema, dan unduh data.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="pw-global" style="font-size: 14px; font-weight: 700">Password admin</label>
<input id="pw-global" type="password" value="contohpassword" readonly="readonly" style="box-sizing: border-box; height: 54px; padding: 0 16px; border-radius: 12px; border: 2px solid {{c.ring}}; background: {{c.field}}; color: {{c.fg}}; font-family: inherit; font-size: 17px">
</div>
<a href="Admin-Global.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 14px; background: {{c.primary}}; color: {{c.onPrimary}}; font-size: 16px; font-weight: 800; text-decoration: none">Masuk</a>
<a href="Masuk-Admin-HP.dc.html" style="align-self: center; color: {{c.fg}}; font-size: 14px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px">Admin sesi? Masuk dengan kode dan PIN</a>
</form>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  pal(mode) {
    if (mode === 'light') return { bg: '#F4F3EE', surface: '#FFFFFF', surface2: '#EFEEE8', line: '#DCDAD1', fg: '#141416', muted: '#55555D', primary: '#141416', onPrimary: '#FFFFFF', markBg: '#141416', field: '#FFFFFF', ring: '#141416' };
    return { bg: '#0D0D0F', surface: '#16161A', surface2: '#1F1F25', line: '#2C2C34', fg: '#F4F3EF', muted: '#A3A3AD', primary: '#FFE14D', onPrimary: '#111111', markBg: '#1F1F25', field: '#0F0F12', ring: '#FFE14D' };
  }
  renderVals() {
    var self = this;
    var mode = (this.state && this.state.mode) || this.props.mode || 'dark';
    return {
      c: this.pal(mode),
      isDark: mode === 'dark',
      isLight: mode === 'light',
      modeNext: mode === 'dark' ? 'terang' : 'gelap',
      toggleMode: function () { self.setState({ mode: mode === 'dark' ? 'light' : 'dark' }); }
    };
  }
}
</script>
</body>
</html>
