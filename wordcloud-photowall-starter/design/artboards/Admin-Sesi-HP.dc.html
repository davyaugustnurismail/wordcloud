<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Admin sesi di HP</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: {{c.bg}}; color: {{c.fg}}; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column">
<header style="box-sizing: border-box; padding: 14px 18px 12px; border-bottom: 1px solid {{c.line}}; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
<div style="display: flex; align-items: center; gap: 10px; min-width: 0">
<span style="font-size: 18px; font-weight: 800; white-space: nowrap">Sesi Photowall</span>
<span style="display: flex; align-items: center; height: 26px; padding: 0 8px; border-radius: 7px; background: {{c.surface2}}; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 13px; letter-spacing: 0.06em">RGW4TK</span>
</div>
<button type="button" onClick="{{toggleMode}}" aria-label="Ganti ke mode {{modeNext}}" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 999px; border: 1px solid {{c.line}}; background: {{c.surface}}; color: {{c.fg}}; cursor: pointer">
<sc-if value="{{isDark}}" hint-placeholder-val="{{true}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
</sc-if>
<sc-if value="{{isLight}}" hint-placeholder-val="{{false}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>
</sc-if>
</button>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; color: {{c.muted}}">
<span style="display: flex; align-items: center; gap: 6px; color: {{c.live}}; font-weight: 800"><span style="width: 8px; height: 8px; border-radius: 999px; background: {{c.live}}"></span>LIVE</span>
<span>Photowall 1 · Input 2 · Admin 1</span>
</div>
</header>
<main style="flex-grow: 1; min-height: 0; overflow: auto; box-sizing: border-box; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px">
<div role="group" aria-label="Mode moderasi" style="display: flex; padding: 4px; border-radius: 14px; background: {{c.surface2}}">
<button type="button" onClick="{{setLangsung}}" aria-pressed="{{langPressed}}" style="flex: 1 1 0; height: 44px; border: 0; border-radius: 10px; background: {{langBg}}; color: {{langFg}}; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer">Langsung</button>
<button type="button" onClick="{{setApprove}}" aria-pressed="{{apprPressed}}" style="flex: 1 1 0; height: 44px; border: 0; border-radius: 10px; background: {{apprBg}}; color: {{apprFg}}; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer">Approve</button>
</div>
<sc-if value="{{isApprove}}" hint-placeholder-val="{{true}}">
<section aria-label="Menunggu approve" style="border-radius: 16px; border: 2px solid {{c.warn}}; background: {{c.surface}}; overflow: hidden">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; box-sizing: border-box; padding: 12px 14px; background: {{c.warnBg}}">
<div style="display: flex; align-items: center; gap: 10px">
<span style="display: flex; align-items: center; justify-content: center; min-width: 36px; height: 36px; box-sizing: border-box; padding: 0 8px; border-radius: 10px; background: {{c.warnSolid}}; color: {{c.onWarn}}; font-size: 20px; font-weight: 800">{{pendingCount}}</span>
<span style="font-size: 15px; font-weight: 800">Menunggu approve</span>
</div>
<button type="button" onClick="{{approveAll}}" style="height: 40px; padding: 0 12px; border-radius: 10px; border: 0; background: {{c.primary}}; color: {{c.onPrimary}}; font-family: inherit; font-size: 13px; font-weight: 800; cursor: pointer">Setujui semua</button>
</div>
<sc-for list="{{pending}}" as="p" hint-placeholder-count="3">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; box-sizing: border-box; padding: 10px 14px; border-top: 1px solid {{c.line}}">
<div style="display: flex; flex-direction: column; min-width: 0">
<span style="font-size: 20px; font-weight: 800">{{p.text}}</span>
<span style="font-size: 12px; color: {{c.muted}}">{{p.time}} · {{p.device}}</span>
</div>
<div style="display: flex; gap: 8px">
<button type="button" onClick="{{p.reject}}" aria-label="Tolak kata {{p.text}}" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 12px; border: 1px solid {{c.line}}; background: transparent; color: {{c.fg}}; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</button>
<button type="button" onClick="{{p.approve}}" aria-label="Setujui kata {{p.text}}" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 12px; border: 0; background: {{c.liveSolid}}; color: {{c.onLive}}; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</button>
</div>
</div>
</sc-for>
</section>
</sc-if>
<section aria-label="Live feed" style="border-radius: 16px; border: 1px solid {{c.line}}; background: {{c.surface}}; overflow: hidden">
<div style="box-sizing: border-box; padding: 12px 14px; font-size: 15px; font-weight: 800">Live feed</div>
<sc-for list="{{feed}}" as="it" hint-placeholder-count="4">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; box-sizing: border-box; padding: 8px 14px; border-top: 1px solid {{c.line}}">
<div style="display: flex; flex-direction: column; min-width: 0">
<span style="font-size: 18px; font-weight: 800; color: {{it.color}}; text-decoration: {{it.deco}}">{{it.text}}</span>
<span style="font-size: 12px; color: {{c.muted}}">{{it.time}} · {{it.status}}</span>
</div>
<button type="button" onClick="{{it.toggle}}" aria-label="{{it.label}}" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px; border: 1px solid {{c.line}}; background: transparent; color: {{c.fg}}; cursor: pointer">
<sc-if value="{{it.visible}}" hint-placeholder-val="{{true}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"></path><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6 0 9.5 7 9.5 7a17 17 0 0 1-3.2 4.1M6.6 6.6A16.7 16.7 0 0 0 2.5 12s3.5 7 9.5 7a9.7 9.7 0 0 0 5.4-1.6"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg>
</sc-if>
<sc-if value="{{it.hidden}}" hint-placeholder-val="{{false}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7S2.5 12 2.5 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
</sc-if>
</button>
</div>
</sc-for>
</section>
</main>
<nav aria-label="Aksi cepat" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; box-sizing: border-box; padding: 8px 10px 12px; border-top: 1px solid {{c.line}}; background: {{c.surface}}">
<button type="button" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 58px; border: 0; border-radius: 12px; background: transparent; color: {{c.fg}}; font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 5v14M15 5v14"></path></svg>
Pause
</button>
<button type="button" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 58px; border: 0; border-radius: 12px; background: transparent; color: {{c.fg}}; font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 2v20M4.9 7l14.2 10M4.9 17L19.1 7"></path></svg>
Freeze
</button>
<a href="Admin-Sesi-Tema.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 58px; border-radius: 12px; color: {{c.fg}}; font-size: 12px; font-weight: 700; text-decoration: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg>
Tema
</a>
<a href="Admin-Sesi-Blocklist.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 58px; border-radius: 12px; color: {{c.fg}}; font-size: 12px; font-weight: 700; text-decoration: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M5.6 5.6l12.8 12.8"></path></svg>
Blocklist
</a>
<button type="button" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 58px; border: 0; border-radius: 12px; background: transparent; color: {{c.danger}}; font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>
Clear
</button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  pal(mode) {
    if (mode === 'light') return { bg: '#F4F3EE', surface: '#FFFFFF', surface2: '#EFEEE8', line: '#DCDAD1', fg: '#141416', muted: '#55555D', primary: '#141416', onPrimary: '#FFFFFF', segOn: '#141416', segOnFg: '#FFFFFF', live: '#157A3A', liveSolid: '#157A3A', onLive: '#FFFFFF', warn: '#A84B00', warnBg: 'rgba(214,110,0,0.12)', warnSolid: '#A84B00', onWarn: '#FFFFFF', danger: '#C21F1F' };
    return { bg: '#0D0D0F', surface: '#16161A', surface2: '#1F1F25', line: '#2C2C34', fg: '#F4F3EF', muted: '#A3A3AD', primary: '#FFE14D', onPrimary: '#111111', segOn: '#FFE14D', segOnFg: '#111111', live: '#3DDC84', liveSolid: '#3DDC84', onLive: '#0B2414', warn: '#FFB25C', warnBg: 'rgba(255,159,67,0.14)', warnSolid: '#FFB25C', onWarn: '#2A1600', danger: '#FF6B6B' };
  }
  renderVals() {
    var self = this;
    var st = this.state || {};
    var mode = st.mode || this.props.mode || 'dark';
    var c = this.pal(mode);
    var mod = st.mod || 'approve';
    var approve = mod === 'approve';
    var decided = st.decided || {};
    var hid = st.hid || {};
    var pendingAll = [
      { id: 'p1', text: 'mantap', time: '21:04:31', device: 'Input-2' },
      { id: 'p2', text: 'rindu', time: '21:04:27', device: 'Input-1' },
      { id: 'p3', text: 'santuy', time: '21:04:22', device: 'Input-2' }
    ];
    function decide(ids, v) { var d = {}, k; for (k in decided) d[k] = decided[k]; ids.forEach(function (id) { d[id] = v; }); self.setState({ decided: d }); }
    var pending = pendingAll.filter(function (p) { return !decided[p.id]; }).map(function (p) {
      return { text: p.text, time: p.time, device: p.device, approve: function () { decide([p.id], 'ok'); }, reject: function () { decide([p.id], 'no'); } };
    });
    var feedRaw = pendingAll.filter(function (p) { return decided[p.id]; }).reverse().map(function (p) { return { id: p.id, text: p.text, time: p.time, hidden: decided[p.id] === 'no' }; }).concat([
      { id: 'f1', text: 'bahagia', time: '21:04:12', hidden: false },
      { id: 'f2', text: 'irie', time: '21:03:58', hidden: false },
      { id: 'f3', text: 'seru', time: '21:03:41', hidden: false },
      { id: 'f6', text: 'jelek', time: '21:02:47', hidden: true }
    ]);
    var feed = feedRaw.map(function (it) {
      var h = hid[it.id] != null ? hid[it.id] : it.hidden;
      return {
        text: it.text, time: it.time, hidden: h, visible: !h,
        color: h ? c.muted : c.fg, deco: h ? 'line-through' : 'none',
        status: h ? 'Disembunyikan' : 'Tampil',
        label: (h ? 'Tampilkan lagi kata ' : 'Sembunyikan kata ') + it.text,
        toggle: function () { var x = {}, k; for (k in hid) x[k] = hid[k]; x[it.id] = !h; self.setState({ hid: x }); }
      };
    });
    return {
      c: c,
      isDark: mode === 'dark',
      isLight: mode === 'light',
      modeNext: mode === 'dark' ? 'terang' : 'gelap',
      toggleMode: function () { self.setState({ mode: mode === 'dark' ? 'light' : 'dark' }); },
      isApprove: approve,
      langPressed: approve ? 'false' : 'true',
      apprPressed: approve ? 'true' : 'false',
      langBg: approve ? 'transparent' : c.segOn,
      langFg: approve ? c.fg : c.segOnFg,
      apprBg: approve ? c.segOn : 'transparent',
      apprFg: approve ? c.segOnFg : c.fg,
      setLangsung: function () { self.setState({ mod: 'langsung' }); },
      setApprove: function () { self.setState({ mod: 'approve' }); },
      pending: pending,
      pendingCount: pending.length,
      approveAll: function () { decide(pendingAll.filter(function (p) { return !decided[p.id]; }).map(function (p) { return p.id; }), 'ok'); },
      feed: feed
    };
  }
}
</script>
</body>
</html>
