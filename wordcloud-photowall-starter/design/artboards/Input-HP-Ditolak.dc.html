<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Input HP — kata diblokir</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
input:focus{outline:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #000000; color: #FFFFFF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column">
<div style="box-sizing: border-box; padding: 24px 22px 0; display: flex; align-items: center; justify-content: flex-end">
<div style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #BDBDBD">
<span style="width: 8px; height: 8px; border-radius: 999px; background: #3DDC84"></span>
Terhubung
</div>
</div>
<div style="flex-grow: 1; box-sizing: border-box; padding: 0 22px 56px; display: flex; flex-direction: column; justify-content: center; gap: 22px">
<div style="padding: 24px 20px; border-radius: 26px; border: 1px solid {{cardBorder}}; background: {{cardBg}}; backdrop-filter: {{cardBlur}}; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 6px; text-align: center">
<label for="kata-hp2" style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 40px; line-height: 1.04; white-space: pre-line">{{prompt}}</label>
</div>
<form style="display: flex; flex-direction: column; gap: 12px; margin: 0">
<input id="kata-hp2" type="text" value="kasar" readonly="readonly" aria-invalid="true" aria-describedby="bantu-hp2" style="box-sizing: border-box; width: 100%; height: 76px; padding: 0 18px; border-radius: 18px; border: 4px solid #FF5A5A; background: #141416; color: #FFFFFF; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 34px; text-align: center">
<div style="display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; color: #BDBDBD">
<span id="bantu-hp2" role="alert" style="display: flex; align-items: center; gap: 6px; color: #FF8080; font-weight: 700; font-size: 16px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5M12 16.5v.01"></path></svg>
Coba kata lain ya
</span>
<span style="font-variant-numeric: tabular-nums">5/20</span>
</div>
<button type="button" style="height: 68px; border: 0; border-radius: 18px; background: #FFE14D; color: #000000; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 30px">Kirim</button>
</form>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"prompt":{"editor":"text","default":"Satu kata untuk malam ini?"},"blur":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var blurOn = !!this.props.blur;
    return {
      prompt: this.props.prompt != null ? this.props.prompt : 'Satu kata untuk malam ini?',
      cardBg: blurOn ? 'rgba(255,255,255,0.07)' : 'transparent',
      cardBorder: blurOn ? 'rgba(255,255,255,0.14)' : 'transparent',
      cardBlur: blurOn ? 'blur(18px)' : 'none'
    };
  }
}
</script>
</body>
</html>
