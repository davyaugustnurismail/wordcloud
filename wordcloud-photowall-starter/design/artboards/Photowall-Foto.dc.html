<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Photowall — Foto</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; background: #000000">
<dc-import name="Main" theme="foto" photo="{{photo}}" overlay="{{overlay}}" count="{{count}}" k="{{k}}" latest="irie" seed="5" hint-size="1280px,720px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"photo":{"editor":"enum","options":["panggung","reggae"],"default":"panggung"},"overlay":{"editor":"range","min":0,"max":85,"step":5,"unit":"%","default":45},"count":{"editor":"range","min":1,"max":300,"step":1,"default":160},"k":{"editor":"range","min":3,"max":24,"step":1,"default":8},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    return { photo: p.photo || 'panggung', overlay: p.overlay != null ? p.overlay : 45, count: p.count != null ? p.count : 160, k: p.k != null ? p.k : 8 };
  }
}
</script>
</body>
</html>
