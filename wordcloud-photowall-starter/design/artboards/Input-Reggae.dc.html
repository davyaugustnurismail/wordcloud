<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Input kata — tema Reggae</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
input::placeholder{color:#6E6E74;opacity:1}
input:focus{outline:none}
button:focus-visible{outline:4px solid #0C0C0C;outline-offset:3px}
</style>
</helmet>
<div style="position: relative; width: 1180px; height: 820px; overflow: hidden; box-sizing: border-box; padding: 40px 56px; background: #F5C02E; color: #0C0C0C; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; user-select: none">
<div style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: flex; flex-direction: column">
<div style="flex-grow: 1; background: #D62F2F"></div>
<div style="flex-grow: 1; background: #F5C02E"></div>
<div style="flex-grow: 1; background: #17924A"></div>
</div>
<sc-if value="{{sent}}" hint-placeholder-val="{{false}}">
<div role="status" style="position: absolute; left: 50%; top: 32px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 12px 22px 12px 16px; border-radius: 999px; background: #0C0C0C; color: #FFFFFF; font-size: 20px; font-weight: 700">
<span style="display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 999px; background: #17924A">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</span>
Terkirim — lihat layar!
</div>
</sc-if>
<div style="position: relative; display: flex; align-items: center; justify-content: flex-end">
<div style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 999px; background: #0C0C0C; font-size: 15px; font-weight: 600; color: #FFFFFF">
<span style="width: 10px; height: 10px; border-radius: 999px; background: #3DDC84"></span>
Terhubung
</div>
</div>
<div style="position: relative; flex-grow: 1; display: flex; align-items: center; justify-content: center">
<div style="width: 820px; padding: 44px 52px; border-radius: 36px; border: 1px solid {{cardBorder}}; background: {{cardBg}}; backdrop-filter: {{cardBlur}}; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center">
<label for="kata-reggae" style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 68px; line-height: 1.02; color: #0c0c0c; white-space: pre-line">{{prompt}}</label>
</div>
<form onSubmit="{{submit}}" style="display: flex; flex-direction: column; gap: 18px; margin: 0">
<input id="kata-reggae" type="text" value="{{value}}" onChange="{{change}}" placeholder="ketik satu kata" autocomplete="off" spellcheck="false" aria-describedby="bantu-reggae" style="box-sizing: border-box; width: 100%; height: 116px; padding: 0 28px; border-radius: 22px; border: 4px solid {{ring}}; background: #FFFFFF; color: #0C0C0C; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 56px; text-align: center; user-select: text">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 28px">
<div id="bantu-reggae" style="display: flex; align-items: center; gap: 8px; font-size: 19px; font-weight: 700; color: #0C0C0C">
<sc-if value="{{hasErr}}" hint-placeholder-val="{{false}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B3261E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5M12 16.5v.01"></path></svg>
</sc-if>
{{msg}}
</div>
<div style="font-size: 17px; font-weight: 700; color: #0C0C0C; font-variant-numeric: tabular-nums">{{len}}/20</div>
</div>
<button type="submit" disabled="{{disabled}}" style="height: 96px; border: 0; border-radius: 22px; background: {{btnBg}}; color: {{btnFg}}; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 42px; cursor: pointer">Kirim</button>
</form>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"prompt":{"editor":"text","default":"Satu kata untuk malam ini?"},"blur":{"editor":"boolean","default":false},"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  componentWillUnmount() {
    if (this._t) clearTimeout(this._t);
  }
  renderVals() {
    var self = this;
    var st = this.state || {};
    var value = st.value || '';
    var err = st.err || null;
    var max = 20;
    var blocked = ['kasar'];
    var trimmed = value.trim();
    var msg = 'Cukup satu kata, tanpa spasi.';
    if (err === 'space') msg = 'Cukup satu kata ya';
    if (err === 'blocked') msg = 'Coba kata lain ya';
    var disabled = !trimmed || err === 'space';
    var blurOn = !!this.props.blur;
    return {
      prompt: this.props.prompt != null ? this.props.prompt : 'Satu kata untuk malam ini?',
      cardBg: blurOn ? 'rgba(255,255,255,0.32)' : 'transparent',
      cardBorder: blurOn ? 'rgba(255,255,255,0.45)' : 'transparent',
      cardBlur: blurOn ? 'blur(18px)' : 'none',
      value: value,
      len: value.length,
      sent: !!st.sent,
      hasErr: !!err,
      msg: msg,
      ring: err ? '#B3261E' : '#0C0C0C',
      disabled: disabled,
      btnBg: disabled ? 'rgba(12,12,12,0.55)' : '#0C0C0C',
      btnFg: disabled ? '#D9D9D9' : '#F5C02E',
      change: function (e) {
        var v = String(e.target.value || '');
        try { v = v.replace(/[^\p{L}\p{N}\- ]/gu, ''); } catch (x) { v = v.replace(/[^A-Za-z0-9\- ]/g, ''); }
        if (v.length > max) v = v.slice(0, max);
        self.setState({ value: v, err: /\S\s+\S/.test(v) ? 'space' : null, sent: false });
      },
      submit: function (e) {
        if (e && e.preventDefault) e.preventDefault();
        var v = (self.state && self.state.value || '').trim();
        if (!v) return;
        if (/\s/.test(v)) { self.setState({ err: 'space' }); return; }
        if (blocked.indexOf(v.toLowerCase()) >= 0) { self.setState({ err: 'blocked' }); return; }
        self.setState({ value: '', err: null, sent: true });
        if (self._t) clearTimeout(self._t);
        self._t = setTimeout(function () { self.setState({ sent: false }); }, 1800);
      }
    };
  }
}
</script>
</body>
</html>
