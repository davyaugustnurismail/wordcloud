<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Landing</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; background: {{c.bg}}; color: {{c.fg}}; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column">
<header style="display: flex; align-items: center; justify-content: flex-end; box-sizing: border-box; padding: 16px 32px">
<button type="button" onClick="{{toggleMode}}" aria-label="Ganti ke mode {{modeNext}}" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid {{c.line}}; background: {{c.surface}}; color: {{c.fg}}; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">
<sc-if value="{{isDark}}" hint-placeholder-val="{{true}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
</sc-if>
<sc-if value="{{isLight}}" hint-placeholder-val="{{false}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>
</sc-if>
Mode {{modeNext}}
</button>
</header>
<main style="flex-grow: 1; display: flex; align-items: center; justify-content: center; box-sizing: border-box; padding: 56px 24px 64px">
<div style="width: 100%; max-width: 1040px; display: flex; flex-direction: column; gap: 32px">
<h1 style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); margin: 0">Pilih peran device ini</h1>
<div style="display: flex; flex-wrap: wrap; gap: 20px">
<a href="Create.dc.html" style="flex: 1 1 340px; min-width: 0; min-height: 300px; box-sizing: border-box; padding: 32px 34px; border-radius: 24px; background: {{c.primary}}; color: {{c.onPrimary}}; text-decoration: none; display: flex; flex-direction: column; justify-content: space-between; gap: 24px">
<div style="display: flex; align-items: center; justify-content: space-between">
<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg>
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 32px; font-weight: 800; letter-spacing: -0.01em">Create Session</div>
<div style="font-size: 16px; line-height: 1.5; font-weight: 500">Jadikan layar ini photowall. Butuh password pembuat sesi.</div>
</div>
</a>
<a href="Join-HP.dc.html" style="flex: 1 1 340px; min-width: 0; min-height: 300px; box-sizing: border-box; padding: 32px 34px; border-radius: 24px; background: {{c.surface}}; border: 1px solid {{c.line}}; color: {{c.fg}}; text-decoration: none; display: flex; flex-direction: column; justify-content: space-between; gap: 24px">
<div style="display: flex; align-items: center; justify-content: space-between">
<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="2.5"></rect><path d="M10.5 18.5h3"></path></svg>
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 32px; font-weight: 800; letter-spacing: -0.01em">Join Session</div>
<div style="font-size: 16px; line-height: 1.5; font-weight: 500; color: {{c.muted}}">Jadikan device ini tempat input kata. Cukup kode sesi 6 karakter.</div>
</div>
</a>
</div>
<div style="display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 15px; color: {{c.muted}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
<a href="Masuk-Admin-HP.dc.html" style="color: {{c.fg}}; font-weight: 700; text-decoration: underline; text-underline-offset: 3px">Masuk admin</a>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  pal(mode) {
    if (mode === 'light') return { bg: '#F4F3EE', surface: '#FFFFFF', surface2: '#EFEEE8', line: '#DCDAD1', fg: '#141416', muted: '#55555D', primary: '#141416', onPrimary: '#FFFFFF', hl: '#FFD400', onHl: '#141416', markBg: '#141416' };
    return { bg: '#0D0D0F', surface: '#16161A', surface2: '#1F1F25', line: '#2C2C34', fg: '#F4F3EF', muted: '#A3A3AD', primary: '#FFE14D', onPrimary: '#111111', hl: '#FFE14D', onHl: '#111111', markBg: '#1F1F25' };
  }
  renderVals() {
    var self = this;
    var mode = (this.state && this.state.mode) || this.props.mode || 'dark';
    return {
      c: this.pal(mode),
      isDark: mode === 'dark',
      isLight: mode === 'light',
      modeNext: mode === 'dark' ? 'terang' : 'gelap',
      toggleMode: function () { self.setState({ mode: mode === 'dark' ? 'light' : 'dark' }); }
    };
  }
}
</script>
</body>
</html>
