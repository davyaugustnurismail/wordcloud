<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Masuk admin sesi — desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; background: {{c.bg}}; color: {{c.fg}}; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column">
<header style="display: flex; align-items: center; justify-content: flex-end; box-sizing: border-box; padding: 16px 32px">
<button type="button" onClick="{{toggleMode}}" aria-label="Ganti ke mode {{modeNext}}" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid {{c.line}}; background: {{c.surface}}; color: {{c.fg}}; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">
<sc-if value="{{isDark}}" hint-placeholder-val="{{true}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
</sc-if>
<sc-if value="{{isLight}}" hint-placeholder-val="{{false}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>
</sc-if>
Mode {{modeNext}}
</button>
</header>
<main style="flex-grow: 1; display: flex; align-items: center; justify-content: center; box-sizing: border-box; padding: 32px 24px 64px">
<div style="width: 100%; max-width: 1040px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 48px 64px">
<div style="flex: 1 1 360px; max-width: 520px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<a href="Landing.dc.html" style="align-self: flex-start; display: flex; align-items: center; gap: 6px; color: {{c.muted}}; font-size: 15px; font-weight: 600; text-decoration: none">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
Kembali
</a>
<div style="display: flex; flex-direction: column; gap: 12px">
<h1 style="margin: 0; font-size: 48px; line-height: 1.05; font-weight: 800; letter-spacing: -0.02em">Masuk admin sesi</h1>
<p style="margin: 0; font-size: 18px; line-height: 1.55; color: {{c.muted}}">Cukup ketik kode sesi dan PIN 6 digit. Tidak perlu kamera.</p>
</div>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; font-size: 15px; line-height: 1.5">
<li style="display: flex; gap: 12px; align-items: flex-start">
<span style="flex-shrink: 0; display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 8px; background: {{c.surface2}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
</span>
<span>Kode dan PIN ada di layar Siap tayang milik pembuat sesi.</span>
</li>
<li style="display: flex; gap: 12px; align-items: flex-start">
<span style="flex-shrink: 0; display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 8px; background: {{c.surface2}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
</span>
<span>Sesi admin aktif 24 jam di device ini.</span>
</li>
</ul>
<a href="Admin-Global-Login.dc.html" style="align-self: flex-start; color: {{c.fg}}; font-size: 15px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px">Masuk sebagai admin global</a>
</div>
<div style="flex: 1 1 420px; max-width: 520px; min-width: 0; box-sizing: border-box; padding: 32px; border-radius: 24px; border: 1px solid {{c.line}}; background: {{c.surface}}; display: flex; flex-direction: column; gap: 20px">
<form style="display: flex; flex-direction: column; gap: 18px; margin: 0">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="kode-admin-d" style="font-size: 15px; font-weight: 700">Kode sesi</label>
<input id="kode-admin-d" type="text" value="RGW4TK" readonly="readonly" style="box-sizing: border-box; height: 64px; padding: 0 18px; border-radius: 14px; border: 1px solid {{c.line}}; background: {{c.field}}; color: {{c.fg}}; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 26px; letter-spacing: 0.2em">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="pin-admin-d" style="font-size: 15px; font-weight: 700">PIN admin</label>
<input id="pin-admin-d" type="password" value="482913" readonly="readonly" inputmode="numeric" aria-describedby="pin-bantu-d" style="box-sizing: border-box; height: 64px; padding: 0 18px; border-radius: 14px; border: 2px solid {{c.ring}}; background: {{c.field}}; color: {{c.fg}}; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 26px; letter-spacing: 0.3em">
<span id="pin-bantu-d" style="font-size: 14px; color: {{c.muted}}">Maksimal 10 percobaan per menit.</span>
</div>
<a href="Admin-Sesi-Live.dc.html" style="display: flex; align-items: center; justify-content: center; height: 60px; margin-top: 4px; border-radius: 16px; background: {{c.primary}}; color: {{c.onPrimary}}; font-size: 17px; font-weight: 800; text-decoration: none">Masuk</a>
</form>
<div style="display: flex; align-items: center; gap: 12px; font-size: 13px; color: {{c.muted}}">
<span style="flex-grow: 1; height: 1px; background: {{c.line}}"></span>
atau
<span style="flex-grow: 1; height: 1px; background: {{c.line}}"></span>
</div>
<button type="button" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 54px; border-radius: 16px; border: 1px solid {{c.line}}; background: transparent; color: {{c.fg}}; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"></path></svg>
Scan QR admin
</button>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  pal(mode) {
    if (mode === 'light') return { bg: '#F4F3EE', surface: '#FFFFFF', surface2: '#EFEEE8', line: '#DCDAD1', fg: '#141416', muted: '#55555D', primary: '#141416', onPrimary: '#FFFFFF', field: '#FFFFFF', ring: '#141416' };
    return { bg: '#0D0D0F', surface: '#16161A', surface2: '#1F1F25', line: '#2C2C34', fg: '#F4F3EF', muted: '#A3A3AD', primary: '#FFE14D', onPrimary: '#111111', field: '#0F0F12', ring: '#FFE14D' };
  }
  renderVals() {
    var self = this;
    var mode = (this.state && this.state.mode) || this.props.mode || 'dark';
    return {
      c: this.pal(mode),
      isDark: mode === 'dark',
      isLight: mode === 'light',
      modeNext: mode === 'dark' ? 'terang' : 'gelap',
      toggleMode: function () { self.setState({ mode: mode === 'dark' ? 'light' : 'dark' }); }
    };
  }
}
</script>
</body>
</html>
