<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Photowall — Putih</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; background: #FFFFFF">
<dc-import name="Main" theme="putih" count="{{count}}" k="{{k}}" latest="seru" seed="11" hint-size="1280px,720px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"count":{"editor":"range","min":1,"max":300,"step":1,"default":160},"k":{"editor":"range","min":3,"max":24,"step":1,"default":8},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    return { count: p.count != null ? p.count : 160, k: p.k != null ? p.k : 8 };
  }
}
</script>
</body>
</html>
