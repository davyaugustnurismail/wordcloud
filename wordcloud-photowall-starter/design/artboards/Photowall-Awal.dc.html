<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Photowall — awal acara</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; background: #000000">
<dc-import name="Main" theme="hitam" count="{{count}}" latest="merdeka" seed="21" hint-size="1280px,720px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"count":{"editor":"range","min":1,"max":30,"step":1,"default":6},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    return { count: p.count != null ? p.count : 6 };
  }
}
</script>
</body>
</html>
